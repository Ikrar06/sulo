name: Landing page

# Sulo's landing page (apps/landing) alone, with every check of its brief (9.7):
# build, outside assets and internal links, CSP and headers, rilis.json, text
# budgets and separators, layout, the interest counter's tests. It runs only
# when the landing page changes (or by hand) and never deploys anything.
on:
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The build photographs the app's screens for the tilted iPhones, and the layout check measures every page.
      - name: Chromium untuk Playwright
        run: pnpm --filter @sulo/landing exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm --filter @sulo/landing typecheck
      - name: Test (penghitung minat, aturan teks, CSP, tingkat gerak)
        run: pnpm --filter @sulo/landing test
      - name: rilis.json
        run: pnpm --filter @sulo/landing check:rilis
      # A placeholder address (RFC 2606) so the absolute addresses and the QR code are built and checked too; the
      # real one is the owner's to choose (docs/landing/DEPLOY.md).
      - name: Build (halaman, iPhone miring, CSP dan _headers)
        run: pnpm --filter @sulo/landing build
        env:
          SITE_URL: https://sulo.example
      - name: Aset dari luar dan tautan internal
        run: pnpm --filter @sulo/landing check:aset
      - name: CSP dan header
        run: pnpm --filter @sulo/landing check:keamanan
      - name: Anggaran teks dan pemisah
        run: pnpm --filter @sulo/landing check:teks
      - name: Tata letak (lebar, ukuran teks)
        run: pnpm --filter @sulo/landing check:landing-layout:ci
      - name: Simpan potret yang gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-layout-gagal
          path: .output/landing-layout-gagal
          if-no-files-found: ignore
          retention-days: 7
