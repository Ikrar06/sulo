name: Android rilis

# Manual (workflow_dispatch) or a pushed tag "v*" only: never on a pull
# request, so a fork's code never runs with the signing secrets. Builds a
# signed release APK and keeps it as an artifact with its SHA-256; the
# certificate must be exactly the one in apps/mobile/release-cert.json.
# Publishing a GitHub Release is a separate, deliberate step (not here).
# No step prints a secret: they reach Gradle only as environment variables.
#
# Secrets (set by the owner with gh secret set, docs/rilis/keystore.md):
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# (optional, default "sulo"), ANDROID_KEY_PASSWORD (optional, default the
# keystore password).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-apk:
    # Only in the owner's repository (a fork has neither the secrets nor the right).
    if: github.repository == 'Ikrar06/sulo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, for the versionCode check.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: versionCode naik
        working-directory: apps/mobile
        # A tag release must match package.json; every release must raise versionCode above the last tag.
        run: node scripts/check-version-code.mjs ${{ github.ref_type == 'tag' && format('--tag={0}', github.ref_name) || '' }}

      - name: Web (produksi) dan cap sync
        working-directory: apps/mobile
        # A release bundle with debug-only code (the debug screen, its notification tests) fails here.
        run: pnpm exec vite build && node scripts/check-no-dev-code.mjs dist && node scripts/check-hosts.mjs dist && node ../extension/scripts/check-neosia-main.mjs dist && pnpm exec cap sync android

      - name: Kunci rilis dari secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 belum diisi."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sulo-release.jks"

      - name: APK rilis bertanda tangan
        working-directory: apps/mobile/android
        env:
          SULO_KEYSTORE_FILE: ${{ runner.temp }}/sulo-release.jks
          SULO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SULO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SULO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verifikasi, SHA-256, sidik jari sertifikat
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          OUT=".output/sulo-$VERSION-android.apk"
          mkdir -p .output
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$OUT"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee .output/signature.txt
          # The certificate must be Sulo's release certificate (public constant), never a debug or stray key.
          EXPECTED=$(node -p "require('./apps/mobile/release-cert.json').sha256.replace(/:/g, '').toLowerCase()")
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' .output/signature.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo "Sertifikat APK bukan sertifikat rilis Sulo (release-cert.json)."; exit 1; }
          (cd .output && sha256sum "sulo-$VERSION-android.apk" > "sulo-$VERSION-android.apk.sha256")
          cat ".output/sulo-$VERSION-android.apk.sha256"
          node apps/extension/scripts/check-leaks.mjs --zip "$OUT"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          (cd apps/mobile && node scripts/check-version-code.mjs --apk="../../$OUT" --aapt="$AAPT" && node scripts/check-permissions.mjs "../../$OUT" --aapt="$AAPT")

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sulo-release.jks"

      - name: Simpan APK rilis
        uses: actions/upload-artifact@v7
        with:
          name: sulo-android-release
          path: |
            .output/sulo-*-android.apk
            .output/sulo-*-android.apk.sha256
            .output/signature.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
