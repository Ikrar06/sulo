name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs before install: it has no dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pemindai data pribadi
        run: node apps/extension/scripts/check-leaks.mjs

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Recorder tidak ikut build produksi
        run: test ! -e .output/chrome-mv3/recorder.html

  # The Android app's layout at the phone's font sizes (check-mobile-layout.mjs): widths 300, 360, 412 and 600,
  # font sizes 100%, 130% and 200%, Indonesian and English. The full matrix runs locally (pnpm check:mobile-layout).
  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chromium untuk Playwright
        run: pnpm --filter @sulo/mobile exec playwright install --with-deps chromium
      - name: Tata letak HP (lebar, ukuran font, bahasa)
        run: pnpm --filter @sulo/mobile run check:mobile-layout:ci
      - name: Simpan potret yang gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-gagal
          path: .output/layout-gagal
          if-no-files-found: ignore
          retention-days: 7

  # The Android app (M8b): debug APK and Kotlin unit tests, no release signing.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (mobile)
        run: pnpm --filter @sulo/mobile run typecheck

      - name: APK debug dan tes Kotlin
        run: pnpm mobile:apk:debug

      - name: Simpan APK debug
        uses: actions/upload-artifact@v7
        with:
          name: sulo-android-debug
          path: .output/sulo-*-android-debug.apk
          # .output/ is a dot folder, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
