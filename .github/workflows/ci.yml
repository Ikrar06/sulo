name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs before install: it has no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pemindai data pribadi
        run: node scripts/check-leaks.mjs

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Recorder tidak ikut build produksi
        run: test ! -e .output/chrome-mv3/recorder.html
