<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- No page zoom: iOS zoomed into a focused field under 16 px and stayed zoomed (owner's iPhone, 27 Nov 2026). Text size follows the phone's own setting instead (src/text-zoom.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Sulo</title>
    <!--
      WebView version guard, for every brand (Huawei's own WebView included):
      the Chromium version from the user agent ("Chrome/NN"). Below the minimum,
      or unreadable on Android, the update page replaces this one before the main
      bundle loads. ES5 only, so it runs on WebView 69. It sends nothing and
      stores nothing. The minimum matches capacitor.config.ts minWebViewVersion
      (checked in tests/webview-guard.test.ts).
    -->
    <script id="sulo-webview-guard">
      (function () {
        var MIN = 111;
        var ua = String(navigator.userAgent || '');
        if (ua.indexOf('Android') === -1) return;
        var m = /Chrome\/(\d+)\./.exec(ua);
        if (m && parseInt(m[1], 10) >= MIN) return;
        window.__suloWebViewTooOld = true;
        if (window.stop) window.stop();
        window.location.replace('/perlu-pembaruan.html');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
