apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Version (M8e E2): versionName is apps/mobile/package.json's version, digits
// and dots only ("0.9.0"); versionCode = major * 10000 + minor * 100 + patch,
// so 0.9.x (900 + x) is always below 1.0.0 (10000). Minor and patch stay
// under 100. scripts/version-code.mjs holds the same rule (tested), and
// scripts/check-version-code.mjs fails a release whose code does not rise.
def suloVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version as String
if (!(suloVersion ==~ /\d+\.\d+\.\d+/)) throw new GradleException("Versi di apps/mobile/package.json harus angka dan titik (x.y.z): ${suloVersion}")
def suloVersionCode = { String v ->
    def (major, minor, patch) = v.tokenize('.').collect { it as int }
    if (minor > 99 || patch > 99) throw new GradleException("Minor dan patch harus di bawah 100: ${v}")
    major * 10000 + minor * 100 + patch
}

android {
    namespace = "dev.ikrar.sulo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.ikrar.sulo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode suloVersionCode(suloVersion)
        versionName suloVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        // BuildConfig.VERSION_NAME goes into the User-Agent ("Sulo/0.9.1 (Android)").
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // Release signing only on CI (.github/workflows/android-release.yml): the
    // keystore comes from repository secrets into a temporary file and never
    // lives in the repository. Without these variables a release build is
    // unsigned.
    signingConfigs {
        // Debug builds, on CI and on a laptop, sign with one fixed debug key
        // (sulo-debug.keystore, Android's usual debug password), so any debug
        // APK updates any other. CI runners made a new key each run before,
        // and the phone refused the update. Not the release key.
        debug {
            storeFile file("sulo-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "pkcs12"
        }
        release {
            def keystore = System.getenv("SULO_KEYSTORE_FILE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("SULO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SULO_KEY_ALIAS") ?: "sulo"
                keyPassword System.getenv("SULO_KEY_PASSWORD") ?: System.getenv("SULO_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        // The name under the icon: "Sulo", and "Sulo (debug)" for a debug build so the two never mix up.
        debug {
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "Sulo (debug)"
            resValue "string", "title_activity_main", "Sulo (debug)"
        }
        release {
            resValue "string", "app_name", "Sulo"
            resValue "string", "title_activity_main", "Sulo"
            if (System.getenv("SULO_KEYSTORE_FILE")) signingConfig signingConfigs.release
            // R8 (M8e E2): shrinks and obfuscates the native code, drops unused resources.
            // Capacitor's own keep rules come with its library; Sulo's are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Background watching (M8c.3): one-off checks in a chain plus a 6-hour guard. Pinned.
    implementation "androidx.work:work-runtime:2.12.0"
    // M8d: WebViewCompat.addDocumentStartJavaScript and addWebMessageListener (the NEOSIA screen).
    implementation "androidx.webkit:webkit:1.15.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // org.json for JVM unit tests (Android's own copy is a stub off-device).
    testImplementation "org.json:json:20260814"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

